services:
  db:
    image: postgres:18-alpine
    container_name: kosh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: kosh
      POSTGRES_DB: kosh
    ports:
      - "5436:5432"
    volumes:
      - kosh-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh -d kosh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kosh-pgdata:
